<style>
.comment-container {
  max-width: 600px;
  margin: 40px auto;
  padding: 20px;
  background: #fafafa;
  border-radius: 12px;
  box-shadow: 0 10px 25px #6d6b6b;
  font-family: 'Nunito', sans-serif;
}

.comment-container h2 {
  margin-bottom: 10px;
  text-align: center;
}

#usernameInput,
#commentInput {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
  border-radius: 8px;
  border: 1px solid #ccc;
  font-size: 15px;
}

#commentInput {
  min-height: 100px;
  resize: vertical;
}

#submitComment {
  background-color: #d62828;
  color: white;
  padding: 10px 18px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: 15px;
}

#submitComment:hover {
  background-color: #b81f1f;
}

/* Comment styles */
.comment {
    display: flex;
    flex-direction: column; /* stack content vertically */
    margin-bottom: 15px;
    border-bottom: 1px solid #f0f0f0;
    padding-bottom: 10px;
    position: relative;
}

.comment-text {
    display: flex;
    flex-direction: column; /* stack user info, comment, stars */
    gap: 5px;
}

.comment-stars-display {
    margin-left: 50px;
}

.delete-button {
    align-self: flex-end; /* move delete button to right under comment */
    background: #dc3545;
    border: none;
    color: #fff;
    cursor: pointer;
    font-size: 14px;
    padding: 5px 10px;
    border-radius: 4px;
    transition: background-color 0.3s;
    white-space: nowrap;
    margin-top: 5px;
}

.delete-button:hover {
    background-color: #c82333;
}

.user-info {
    display: flex;
    align-items: center;
    gap: 10px;
}

.user-info img {
    width: 40px;
    height: 40px;
    border-radius: 50%;
}

.username {
    font-weight: bold;
}

#comments {
    margin-bottom: 20px;
    max-height: 300px;
    overflow-y: auto;
}

<div class="comment-container">
   <h2>Write a review</h2>
   <img src="./IMAGES/loggo.png" style="margin-left: 200px;" class="rlogo">
   <input type="text" id="usernameInput" placeholder="Enter your name" required>
   <textarea id="commentInput" placeholder="Write your review here..." required></textarea>
   <h3>Please refresh the page to delete your submitted comment</h3>
   <button id="submitComment">Submit</button>
   <div class="allreviews">
   <h2>All reviews:</h2>
   <div id="comments"></div></div>
</div>

<script src="./script.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
    const commentsContainer = document.getElementById("comments");
    const commentInput = document.getElementById("commentInput");
    const usernameInput = document.getElementById("usernameInput");
    const submitButton = document.getElementById("submitComment");
    let currentRating = 0;

    // Current user ONLY for this session (not saved)
    let currentUser = "";

    // Load comments
    const loadComments = () => {
        commentsContainer.innerHTML = "";
        const comments = JSON.parse(localStorage.getItem("comments")) || [];
        comments.reverse().forEach(comment => {
            displayComment(comment.text, comment.rating, comment.id, comment.username);
        });
    };

    // Display comment
    const displayComment = (text, rating, id, username) => {
        const commentDiv = document.createElement("div");
        commentDiv.classList.add("comment");
        commentDiv.setAttribute("data-id", id);

        let starDisplayHtml = '';
        if (rating > 0) {
            starDisplayHtml = `<div class="comment-stars-display">`;
            for (let i = 0; i < rating; i++) {
                starDisplayHtml += `<span class="star active">&#9733;</span>`;
            }
            starDisplayHtml += `</div>`;
        }

        const showDelete = currentUser === username
            ? `<button class="delete-button" onclick="deleteComment('${id}', '${username}')">Delete</button>`
            : '';

        commentDiv.innerHTML = `
            <div class="comment-text">
                <div class="user-info">
                    <img src="./user.jpg" alt="User Logo">
                    <p><strong>${username}:</strong> ${text}</p>
                </div>
                ${starDisplayHtml}
            </div>
            ${showDelete}
        `;

        commentsContainer.appendChild(commentDiv);
    };

    // Submit comment
    submitButton.addEventListener("click", () => {
        const commentText = commentInput.value.trim();
        const username = usernameInput.value.trim();

        if (!commentText || !username) {
            alert('Please enter your name and comment.');
            return;
        }

        const commentId = Date.now().toString();
        currentUser = username; // session-only

        displayComment(commentText, currentRating, commentId, username);
        saveComment(commentText, currentRating, commentId, username);

        commentInput.value = "";
        currentRating = 0;
    });

    // Save comment (username saved WITH comment, but not as user session)
    const saveComment = (text, rating, id, username) => {
        const comments = JSON.parse(localStorage.getItem("comments")) || [];
        comments.push({ text, rating, id, username });
        localStorage.setItem("comments", JSON.stringify(comments));
    };

    // Delete comment
    window.deleteComment = (id, username) => {
        if (currentUser !== username) {
            alert("You can only delete your own comments!");
            return;
        }
        const comments = JSON.parse(localStorage.getItem("comments")) || [];
        const filteredComments = comments.filter(comment => comment.id !== id);
        localStorage.setItem("comments", JSON.stringify(filteredComments));
        loadComments();
    };

    loadComments();
});

</script>
